[project]
name = "mcts-ued"
version = "0.1.0"
description = "UED over partner policies in overcooked v2: MCTS vs PPO as solvers of the minimax-regret game"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "Mouhssine Rifaki"},
]
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "tqdm>=4.66",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.5",
    "ruff>=0.4",
]
jax = [
    "jax>=0.4.30",
    "jaxlib>=0.4.30",
    "flax>=0.8",
    "optax>=0.2",
    "jaxmarl @ git+https://github.com/FLAIROx/JaxMARL.git",
]

[project.scripts]
mcts-ued-train = "mcts_ued.train:main"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/mcts_ued"]
